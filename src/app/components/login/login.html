<div class="login-container">
  <div class="login-card">
    <!-- Sección de Marca -->
    <div class="brand-header">
      <div class="brand-logo-container">
        <!-- Logotipo SVG de marca personalizado de alta fidelidad -->
        <svg class="brand-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <!-- Arco de Estrellas (5 estrellas arqueadas en la parte superior) -->
          <!-- Estrella 1 -->
          <path d="M36 30l1.2 2.5 2.8.4-2 2 1 2.8-3-1.6-3 1.6 1-2.8-2-2 2.8-.4L36 30z" fill="#b8976f" />
          <!-- Estrella 2 -->
          <path d="M48 22l1.2 2.5 2.8.4-2 2 1 2.8-3-1.6-3 1.6 1-2.8-2-2 2.8-.4L48 22z" fill="#b8976f" />
          <!-- Estrella 3 (Centro) -->
          <path d="M60 18l1.2 2.5 2.8.4-2 2 1 2.8-3-1.6-3 1.6 1-2.8-2-2 2.8-.4L60 18z" fill="#b8976f" />
          <!-- Estrella 4 -->
          <path d="M72 22l1.2 2.5 2.8.4-2 2 1 2.8-3-1.6-3 1.6 1-2.8-2-2 2.8-.4L72 22z" fill="#b8976f" />
          <!-- Estrella 5 -->
          <path d="M84 30l1.2 2.5 2.8.4-2 2 1 2.8-3-1.6-3 1.6 1-2.8-2-2 2.8-.4L84 30z" fill="#b8976f" />

          <!-- Líneas curvas que indican diseño circular -->
          <path d="M35 48 C 42 38, 78 38, 85 48" stroke="#b8976f" stroke-width="1" fill="none" stroke-dasharray="2,2" />

          <!-- Cloche (tapa de plato para servir comida) en el centro -->
          <!-- Manija / Pomo -->
          <circle cx="60" cy="50" r="4.5" stroke="#b8976f" stroke-width="2.5" fill="none" />
          <!-- Cúpula de la tapa -->
          <path d="M38 78 C 38 56, 82 56, 82 78 Z" stroke="#b8976f" stroke-width="2.5" fill="none"
            stroke-linejoin="round" />
          <!-- Línea de agarre / diseño en la tapa -->
          <path d="M42 78 C 45 68, 75 68, 78 78" stroke="#b8976f" stroke-width="1.2" fill="none" />
          <!-- Base del plato -->
          <path d="M30 83 L 90 83 C 86 87, 34 87, 30 83 Z" fill="#b8976f" />
          <path d="M26 81 L 94 81" stroke="#b8976f" stroke-width="2.5" stroke-linecap="round" />

          <!-- Rama de olivo frondosa a la derecha -->
          <path d="M82 92 C 92 88, 98 78, 94 62 C 92 58, 88 52, 85 48" stroke="#b8976f" stroke-width="1.5" fill="none"
            stroke-linecap="round" />
          <!-- Hojas -->
          <path d="M83 90 C 85 85, 89 86, 89 90 C 89 94, 85 93, 83 90 Z" fill="#b8976f" />
          <path d="M89 83 C 92 78, 96 80, 95 84 C 94 88, 90 87, 89 83 Z" fill="#b8976f" />
          <path d="M93 74 C 97 70, 100 73, 98 77 C 96 81, 93 78, 93 74 Z" fill="#b8976f" />
          <path d="M93 63 C 97 60, 99 63, 97 67 C 95 71, 93 67, 93 63 Z" fill="#b8976f" />
          <path d="M90 54 C 93 50, 95 53, 93 57 C 91 61, 89 57, 90 54 Z" fill="#b8976f" />
          <path d="M85 48 C 87 44, 89 46, 88 49 C 87 52, 84 50, 85 48 Z" fill="#b8976f" />
        </svg>
      </div>
      <h1 class="brand-title">The Daily Feast</h1>
      <p class="brand-subtitle">Reseñas reales. Experiencias inolvidables.</p>

      <!-- Divisor elegante con corazón -->
      <div class="brand-separator">
        <span class="sep-line"></span>
        <span class="heart-icon">♥</span>
        <span class="sep-line"></span>
      </div>
    </div>

    <!-- Formulario de Inicio de Sesión -->
    <form class="login-form" [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()">
      <!-- Campo de Correo Electrónico -->
      <div class="form-group">
        <label for="email" class="input-label">Correo electrónico</label>
        <div class="input-container">
          <span class="field-icon">
            <!-- Icono SVG de Correo -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
          </span>
          <input type="email" id="email" class="form-input" placeholder="Ingresa tu correo" required
            autocomplete="email" />
        </div>
      </div>

      <!-- Campo de Contraseña -->
      <div class="form-group">
        <label for="password" class="input-label">Contraseña</label>
        <div class="input-container">
          <span class="field-icon">
            <!-- Icono SVG de Candado -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input [type]="showPassword ? 'text' : 'password'" id="password" class="form-input password-input"
            placeholder="Ingresa tu contraseña" required autocomplete="current-password" />

          <!-- Icono de ojo para alternar visibilidad -->
          <button type="button" class="password-toggle" (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            @if (showPassword) {
            <!-- SVG de Ojo Cerrado -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <!-- SVG de Ojo Abierto -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </div>

      <!-- Recordar usuario y ¿Olvidaste tu contraseña? -->
      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" id="remember" class="remember-checkbox" />
          <span class="custom-checkbox"></span>
          Recuérdame
        </label>
        <a href="javascript:void(0)" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón de Envío -->
      <button type="submit" class="submit-button">Iniciar sesión</button>
    </form>

    <!-- Separador "o" -->
    <div class="separator-or">
      <span class="separator-line"></span>
      <span class="separator-text">o</span>
      <span class="separator-line"></span>
    </div>

    <!-- Botón de Google -->
    <button type="button" class="google-button">
      <!-- Icono SVG de Google -->
      <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          fill="#4285F4" />
        <path
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          fill="#34A853" />
        <path
          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
          fill="#FBBC05" />
        <path
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
          fill="#EA4335" />
      </svg>
      Continuar con Google
    </button>

    <!-- Enlace de Registro al Pie de la Tarjeta -->
    <div class="card-footer">
      <span>¿No tienes cuenta?</span>
      <a href="javascript:void(0)" class="register-link">Regístrate</a>
    </div>
  </div>
</div>
